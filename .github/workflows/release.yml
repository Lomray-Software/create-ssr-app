name: Release

on:
  push:
    branches: [prod, staging]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.ref }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Commit lint release commit
        run: git log -1 --pretty=%B | npx --no-install commitlint -g commitlint.config.js
      - run: npm run lint:check
      - run: npm run ts:check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Test GitHub templates and build minimal
        env:
          CREATE_SSR_APP_E2E: '1'
        run: npm run test:e2e
      - name: Smoke test the built CLI
        run: node bin/create-ssr-app.mjs /tmp/smoke-app --template minimal --no-install --no-git -y
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
