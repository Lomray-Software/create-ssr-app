name: Check PR

on:
  pull_request:
    branches: [prod, staging]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.ref }}-check-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Commit lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint -g commitlint.config.js
      - run: npm run lint:check
      - run: npm run ts:check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Test GitHub templates and build minimal
        env:
          CREATE_SSR_APP_E2E: '1'
        run: npm run test:e2e
      - name: Smoke test the built CLI
        run: node bin/create-ssr-app.mjs /tmp/smoke-app --template minimal --no-install --no-git -y
